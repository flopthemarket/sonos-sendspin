name: Sendspin Sonos Gateway
version: "0.2.0"
slug: sendspin_sonos_gateway
description: Bridges a Sendspin audio stream to Sonos speakers with a live, glitch-free delay control.
url: "https://github.com/flopthemarket/sonos-sendspin"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf

startup: services
boot: auto
init: false

# Needed so SSDP discovery of Sonos ZonePlayers works, and so the
# gateway's HTTP stream server is directly reachable by Sonos on the LAN.
host_network: true

# Needed to create/update HA entities (number, sensor, button, switch)
# and to receive service calls via the Supervisor API.
homeassistant_api: true
hassio_api: true

# Ingress lets the /calibrate page be opened through Home Assistant's own
# frontend (Settings -> Add-ons -> this add-on -> Open Web UI) instead of
# a raw http://<lan-ip>:8099 URL. This matters for more than convenience:
# browsers only expose microphone access (getUserMedia) in a "secure
# context" - HTTPS, or literally localhost - and a bare LAN-IP http:// URL
# is never treated as one. An ingress-embedded page inherits the security
# context of the Home Assistant frontend itself, so if HA is reachable
# over HTTPS (Nabu Casa, a reverse proxy, or a configured cert), the
# calibration page's microphone access starts working through ingress
# even though it never would over the raw port. See the README for the
# real limitation this doesn't solve (HA itself still needs to be HTTPS).
ingress: true
ingress_port: 8099
panel_icon: mdi:tune-vertical
panel_title: Sendspin Calibration

# Entities (number.sendspin_delay, sensors, button, switch) are published
# via MQTT discovery, which is the standard way for a *supervisor add-on*
# (as opposed to a custom integration) to create fully-fledged HA entities.
services:
  - "mqtt:want"

# Still needed independently of ingress: Sonos's own play_uri call must
# reach this port directly over the LAN, and never goes through Home
# Assistant's ingress proxy.
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Audio stream endpoint consumed by Sonos (play_uri); also serves /calibrate directly"

options:
  sonos_ip: ""
  sendspin_host: ""
  sendspin_port: 8927
  player_name: "Living Room Sonos"
  delay_ms: 1800
  buffer_ms: 5000
  stream_format: "flac"
  log_level: "info"

schema:
  sonos_ip: str
  sendspin_host: str
  sendspin_port: int
  player_name: str
  delay_ms: int(0,5000)
  buffer_ms: int(1000,20000)
  stream_format: list(flac|mp3|wav)
  log_level: list(debug|info|warning|error)

# No `image:` field on purpose: without a real published registry image,
# declaring one here just makes Supervisor try (and fail) to pull a
# nonexistent tag. Omitting it tells Supervisor to build the image locally
# from this directory's Dockerfile + build.yaml instead, which is what you
# want for a local/community add-on that isn't publishing prebuilt images.
